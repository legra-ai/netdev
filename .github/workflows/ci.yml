name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  lint:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Run rustfmt
        run: cargo fmt --all --check

  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: swatinem/rust-cache@v2

      - name: "Display network interfaces on machine (for test failure debugging)"
        run: cargo run --example list_interfaces

      - name: Run cargo build
        run: cargo build

      - name: Run cargo test
        run: cargo test

      - name: Run cargo check with all features
        run: cargo check --all-features

  cross:
    name: Cross compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - armv7-linux-androideabi
          - aarch64-linux-android
          - x86_64-unknown-freebsd
          - x86_64-unknown-netbsd

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross

      - name: Cross Compile Check
        run: |
          export CARGO_TARGET_DIR=target/build/${{ matrix.target }}
          cross check --target ${{ matrix.target }}

  dependency-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node scripts/lint-dependabot-policy.mjs
  dependency-validation:
    name: Dependency validation
    if: always() && github.event_name == 'pull_request'
    needs: ["lint", "check", "cross", "dependency-policy"]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: legra-ai/github-actions/.github/actions/require-ci-success@5b31798a4624366a3c0e3f331e41b8c55ccbfa53
        with:
          results: ${{ toJSON(needs) }}
